# version: "3.8"

services:
  db:
    image: postgres:15
    restart: always
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file: .env
    command: gunicorn systeme_notification.wsgi:application --bind 0.0.0.0:8000
    depends_on:
      - db

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./webroot:/webroot
      - ./certs:/certs
    depends_on:
      - web

volumes:
  postgres_data:
