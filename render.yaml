services:
  - type: web
    name: systeme-notification-web
    env: python
    plan: free
    region: frankfurt

    buildCommand: |
      cd webapp
      pip install -r requirements.txt

    startCommand: |
      # cd webapp
      gunicorn systeme_notification.wsgi:application --bind 0.0.0.0:$PORT

    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: systeme_notification_db
          property: connectionString
      - key: RENDER
        value: "TRUE"

databases:
  - name: systeme_notification_db
    plan: free
